name: CI

on:
  push:
    branches: [develop]
    path: 
      - 'src/**'
      - 'public/**'

jobs:
  build-check:
    name: Build & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check output size
        run: |
          echo "=== dist/ size ==="
          du -sh dist/
          echo "=== HTML files ==="
          find dist -name "*.html" | xargs wc -c | sort -rn | head -10
