name: Deploy

on:
  push:
    branches: [main]

# Required for OIDC token exchange
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & deploy to S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Hashed assets (JS, CSS, fonts, images) — long-lived, immutable
      - name: Sync hashed assets
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME }} \
            --delete \
            --exclude "*.html" \
            --exclude "robots.txt" \
            --exclude "sitemap*.xml" \
            --exclude "rss.xml" \
            --cache-control "public, max-age=31536000, immutable"

      # HTML and other non-hashed files — no cache
      - name: Sync HTML and meta files
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME }} \
            --exclude "*" \
            --include "*.html" \
            --include "robots.txt" \
            --include "sitemap*.xml" \
            --include "rss.xml" \
            --cache-control "public, no-cache, must-revalidate"

      - name: Invalidate CloudFront HTML cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*.html" "/sitemap*.xml" "/rss.xml"
